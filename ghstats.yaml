version: 1

scope:
  exclude_repos:
    - wewesss/skip-anywhere
    - miralabs-tech/standarui
    - miralabs-tech/standargraph

languages:
  mode: raw

render:
  blocks:
    - stats: [totals, distribution]
    - languages: [bars, iso, cells, treemap, shift, terminal]
    - history: [views, clones]
  private_bar: true
  languages:
    colors: accent
  theme:
    preset: noir
    accent: cycle
  motion: true

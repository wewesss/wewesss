version: 1

scope:
  exclude_repos:
    - wewesss/skip-anywhere
    - miralabs-tech/standarui
    - miralabs-tech/standargraph

languages:
  mode: adjusted
  exclude: [HTML, CSS, SCSS]

profile:
  tagline: SOFTWARE · GAMES · EXPERIMENTS
  location: caen, fr
  note: no fixed stack — it depends on what I'm making
  focus:
    - name: WEB & DESKTOP
      building: [headless UI kits, browser extensions, Rust desktop apps]
    - name: GAMES
      building: [Unreal Engine tooling, modding toolchains, indie games]
    - name: AI & AUTOMATION
      building: [agent-driven toolchains, MCP servers, review loops for agents]
    - name: SYSTEMS
      building: [an embeddable scripting language, pattern-matching libs, low-level C & asm]
  links:
    - youtube: "@wewesss14"
    - twitch: wewesss14
    - discord: https://discord.com/invite/B6Z5VbA5wd
    - website: https://miralabs.tech
    - github_sponsors: wewesss

render:
  layout: wide
  blocks:
    - stats: [totals, distribution]
    - languages: [bars, iso, cells, treemap, shift, terminal]
    - history: [views, clones]
  private_bar: true
  languages:
    colors: accent
  theme:
    preset: noir
    accent: cycle
  motion: true
